name: Deploy to FastAPI Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY as GitHub Actions repository secrets."
            exit 1
          fi
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Deploy to FastAPI Cloud
        run: |
          if [ -z "$FASTAPI_CLOUD_TOKEN" ]; then
            echo "::error::Set FASTAPI_CLOUD_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi
          echo "Starting deployment for app $FASTAPI_CLOUD_APP_ID"
          uv run fastapi deploy --app-id "$FASTAPI_CLOUD_APP_ID"
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
