[project]
name = "clubs"
version = "0.1.0"
description = "A service for book and movie clubs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.138.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.15.15",
]
